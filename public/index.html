<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GEクリエイティブ 社内マニュアルAI。登録済みの社内マニュアルをもとに回答します。">
  <title>社内マニュアルAI｜GEクリエイティブ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="chat.css?v=20260917-brand1">
  <script src="chat.js?v=20260917-brand1" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img class="brand-logo" src="assets/ge-creative-logo.webp" width="512" height="108" alt="GEクリエイティブ">
        <div class="brand-copy">
          <h1>社内マニュアルAI</h1>
          <p>社内の「どうする？」を、ここで。</p>
        </div>
      </div>
      <button id="clear-button" class="quiet-button" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 9M3 4v6h6"/></svg>
        <span class="desktop-label">会話をクリア</span><span class="mobile-label">クリア</span>
      </button>
    </header>

    <main class="chat-container" aria-label="マニュアルについて質問する">
      <div class="conversation-region">
        <div id="chat-messages" class="chat-messages" role="region" aria-label="現在の会話" tabindex="0">
          <section id="welcome" class="welcome">
            <div class="welcome-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1ZM12 5v15M6 8h3M15 8h3M6 12h3M15 12h3"/></svg></div>
            <h2><span>何をお手伝い</span><span>しましょうか？</span></h2>
            <p>勤怠・申請・社内ルールについて、<br class="mobile-break">いつもの言葉で質問してください。<br>登録済みのマニュアルをもとに回答します。</p>
            <div class="suggestions" aria-label="質問の例">
              <button type="button" class="suggestion" data-question="有給休暇の申請方法を教えてください。"><span>有給休暇の申請方法</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
              <button type="button" class="suggestion" data-question="勤怠の修正方法を教えてください。"><span>勤怠を修正したい</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
              <button type="button" class="suggestion" data-question="経費精算の手順を教えてください。"><span>経費精算の手順</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
            </div>
          </section>
          <div id="message-list" class="message-list"></div>
        </div>
        <button id="latest-button" class="latest-button" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>最新の回答へ
        </button>
      </div>

      <section class="composer-area" aria-label="質問の入力">
        <div id="typing-indicator" class="typing-indicator" role="status" hidden>
          <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>マニュアルを確認しています…</span>
        </div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="user-input">社内マニュアルについての質問</label>
          <textarea id="user-input" rows="2" maxlength="1000" placeholder="社内ルールや申請方法について質問してください" enterkeyhint="enter" aria-describedby="input-note input-count"></textarea>
          <div class="composer-controls">
            <div class="input-help"><span id="input-note"><span class="desktop-hint">Enterで送信 · Shift + Enterで改行</span><span class="mobile-hint">送信ボタンで質問できます</span></span><span id="input-count">0 / 1,000</span></div>
            <button id="send-button" class="send-button" type="button" disabled aria-label="質問を送信">
              <span id="send-label">送信</span>
              <svg id="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              <svg id="stop-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">AIの回答には誤りが含まれる場合があります。<span>重要な内容は担当者にもご確認ください。</span></p>
      </section>
    </main>
    <footer class="app-footer">会話の保存・履歴一覧はありません。ページを更新すると、この画面の会話は消えます。</footer>
  </div>

  <dialog id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description">
    <h2 id="clear-title">会話をクリアしますか？</h2>
    <p id="clear-description">この画面のやり取りを消去します。元に戻すことはできません。</p>
    <div class="dialog-actions"><button id="cancel-clear" class="quiet-button" type="button" autofocus>キャンセル</button><button id="confirm-clear" class="confirm-button" type="button">クリアする</button></div>
  </dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p>チャットを利用するにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>

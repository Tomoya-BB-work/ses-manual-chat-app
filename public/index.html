<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="GEクリエイティブ 社内マニュアルAI。社内の手続きやルールについて質問できます。" />
  <title>社内マニュアルAI｜GEクリエイティブ</title>
  <style>
    :root {
      --brand: #33baab; --accent: #087e73; --accent-hover: #06665d;
      --ink: #213d39; --muted: #617773; --border: #e0e9e6;
      --surface: #ffffff; --canvas: #f4f8f7; --tint: #edf8f5;
      --danger: #a73d43; --radius: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      color: var(--ink); font-synthesis: none; -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--canvas); }
    button, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .app-shell { position: relative; top: var(--app-top, 0px); height: var(--app-height, 100dvh); width: min(1104px, calc(100% - 64px)); margin: auto; padding: 24px 0 18px; display: flex; flex-direction: column; min-height: 0; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 3px 21px; flex: none; }
    .brand { display: flex; align-items: center; gap: 24px; min-width: 0; }
    .company-logo { display: block; width: 190px; height: auto; flex: none; }
    .brand-copy { border-left: 1px solid #d1dfdb; padding-left: 24px; }
    h1 { font-size: 21px; font-weight: 700; letter-spacing: .025em; line-height: 1.5; margin: 0; }
    .brand-copy p { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.6; }
    .clear-button { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); color: var(--muted); border: 1px solid #d4e1dc; border-radius: 10px; padding: 10px 13px; font-size: 12px; white-space: nowrap; }
    .clear-button:hover { color: var(--accent); background: var(--tint); }
    .clear-button .icon { width: 17px; height: 17px; }
    .chat-container { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 10px 35px #204c3f06; overflow: hidden; }
    .chat-messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: thin; scrollbar-color: #bdcdc7 transparent; padding: 36px clamp(22px, 5vw, 64px) 24px; }
    .welcome { max-width: 660px; margin: 0 auto; padding: clamp(20px, 5vh, 56px) 0 20px; }
    .welcome-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--tint); color: var(--accent); margin-bottom: 22px; }
    .welcome-icon .icon { width: 26px; height: 26px; }
    .welcome h2 { font-size: clamp(24px, 3vw, 30px); line-height: 1.65; font-weight: 650; letter-spacing: .03em; margin: 0 0 12px; }
    .welcome p { font-size: 14px; line-height: 1.9; color: var(--muted); margin: 0; }
    .suggestions { display: flex; flex-direction: column; margin-top: 29px; border-top: 1px solid var(--border); }
    .suggestion { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; color: var(--ink); padding: 13px 4px; font-size: 13px; line-height: 1.6; }
    .suggestion .icon:first-child { color: var(--accent); width: 18px; }
    .suggestion .icon:last-child { margin-left: auto; width: 16px; color: #64827a; }
    .suggestion:hover { background: #f5faf8; }
    .message { max-width: 100%; margin: 0 auto 28px; width: min(100%, 848px); overflow-wrap: anywhere; }
    .message-label { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 9px; }
    .message-label .icon { width: 15px; height: 15px; color: var(--accent); }
    .message p { margin: 0; font-size: 15px; line-height: 1.95; white-space: pre-wrap; }
    .assistant-message .message-body { padding: 19px 22px; border: 1px solid #e5edeb; background: #f9fbfa; border-radius: 4px 15px 15px 15px; }
    .user-message { display: flex; flex-direction: column; align-items: flex-end; }
    .user-message .message-body { max-width: 88%; background: #e7f5f0; padding: 13px 19px; border-radius: 15px 15px 4px 15px; }
    .message.pending .message-body { display: none; }
    .message-actions { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .copy-button, .retry-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 6px 9px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); font-size: 11px; }
    .copy-button:hover, .retry-button:hover { color: var(--accent); background: var(--tint); }
    .copy-button .icon { width: 15px; height: 15px; }
    .error-message .message-body { border-color: #efd8d9; background: #fff7f7; color: var(--danger); }
    .message-notice { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
    .jump-wrap { position: relative; height: 0; z-index: 2; flex: none; display: flex; justify-content: center; }
    .jump-button { position: absolute; bottom: 12px; min-height: 44px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid #cbded7; border-radius: 24px; padding: 9px 16px; color: var(--accent); background: white; box-shadow: 0 4px 18px #204c3f12; font-size: 12px; }
    .jump-button .icon { width: 16px; }
    .composer-area { flex: none; border-top: 1px solid #eaf0ed; padding: 14px clamp(22px, 5vw, 64px) 17px; background: var(--surface); }
    .typing-indicator { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; min-height: 28px; margin: -2px 0 8px; }
    .typing-indicator.visible { display: flex; }
    .typing-dots { display: inline-flex; gap: 4px; }
    .typing-dots span { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: pulse 1.1s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: .16s; }
    .typing-dots span:nth-child(3) { animation-delay: .32s; }
    .message-input { display: flex; gap: 10px; align-items: flex-end; padding: 8px; border: 1px solid #b9cfc7; border-radius: 14px; box-shadow: 0 2px 4px #204c3f04; }
    .message-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #087e7310; }
    #user-input { display: block; flex: 1; width: 100%; min-width: 0; min-height: 48px; max-height: 132px; resize: none; border: 0; outline: none; background: transparent; padding: 12px 8px; line-height: 1.5; font-size: 16px; color: var(--ink); }
    #user-input::placeholder { color: #70857e; font-size: 14px; }
    #send-button { display: flex; justify-content: center; align-items: center; gap: 7px; height: 48px; min-width: 88px; padding: 0 16px; flex: none; border: 0; border-radius: 10px; color: #fff; background: var(--accent); font-size: 13px; font-weight: 650; }
    #send-button:hover:not(:disabled) { background: var(--accent-hover); }
    #send-button:disabled { background: #e4ede9; color: #768a81; }
    #send-button .icon { width: 17px; height: 17px; }
    #send-button.is-stopping { background: #415952; }
    .composer-meta { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-top: 9px; font-size: 10px; line-height: 1.7; color: var(--muted); }
    .composer-meta p { margin: 0; }
    .keyboard-hint { white-space: nowrap; }
    .footnote { flex: none; text-align: center; font-size: 10px; color: var(--muted); margin: 11px 0 0; line-height: 1.7; }
    .clear-dialog { width: min(420px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 18px; padding: 25px; color: var(--ink); box-shadow: 0 24px 80px #173e3328; }
    .clear-dialog::backdrop { background: #14352d55; }
    .clear-dialog h2 { margin: 0 0 12px; font-size: 18px; }
    .clear-dialog p { margin: 0; font-size: 13px; line-height: 1.85; color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 23px; }
    .dialog-actions button { min-height: 44px; border-radius: 9px; padding: 10px 16px; border: 1px solid var(--border); background: white; color: var(--ink); font-size: 13px; }
    .dialog-actions .confirm { background: var(--accent); border-color: var(--accent); color: white; }
    @keyframes pulse { 0%,80%,100% { opacity: .35; } 40% { opacity: 1; } }
    @media (max-width: 760px) {
      body { background: var(--surface); }
      .app-shell { width: 100%; padding: 0; }
      .app-header { gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--border); }
      .brand { align-items: flex-start; flex-direction: column; gap: 9px; }
      .company-logo { width: 154px; }
      .brand-copy { border: 0; padding: 0; }
      h1 { font-size: 17px; }
      .brand-copy p { display: none; }
      .clear-button { align-self: center; background: transparent; padding: 9px 11px; font-size: 12px; }
      .clear-long { display: none; }
      .chat-container { border: 0; border-radius: 0; box-shadow: none; }
      .chat-messages { padding: 24px 18px 20px; }
      .welcome { padding: clamp(4px, 4vh, 36px) 4px 18px; }
      .welcome h2 { font-size: 25px; }
      .welcome p { font-size: 13px; }
      .welcome-icon { width: 43px; height: 43px; margin-bottom: 19px; border-radius: 12px; }
      .suggestions { margin-top: 24px; }
      .suggestion { min-height: 55px; font-size: 12px; gap: 10px; }
      .message { margin-bottom: 24px; }
      .message p { font-size: 15px; line-height: 1.9; }
      .assistant-message .message-body { padding: 15px 16px; }
      .user-message .message-body { max-width: 92%; padding: 12px 15px; }
      .composer-area { padding: 11px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
      .message-input { padding: 6px; gap: 3px; }
      #user-input { max-height: 112px; padding: 12px 7px; }
      #user-input::placeholder { font-size: 13px; }
      #send-button { min-width: 72px; padding: 0 11px; gap: 5px; }
      #send-button .icon { width: 16px; }
      .composer-meta { font-size: 10px; margin-top: 7px; padding: 0 2px; }
      .keyboard-hint, .footnote { display: none; }
      :root[data-keyboard="true"] .app-header { padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
      :root[data-keyboard="true"] .brand { flex-direction: row; align-items: center; gap: 11px; }
      :root[data-keyboard="true"] .company-logo { width: 115px; }
      :root[data-keyboard="true"] h1 { font-size: 13px; }
      :root[data-keyboard="true"] .clear-button span { display: none; }
      :root[data-keyboard="true"] .composer-area { padding-bottom: 8px; }
      :root[data-keyboard="true"] .composer-meta { display: none; }
    }
    @media (pointer: coarse) { .keyboard-hint { display: none; } }
    @media (max-width: 360px) { .chat-messages { padding-left: 13px; padding-right: 13px; } .welcome h2 { font-size: 23px; } #send-button { min-width: 64px; } }
    @media (max-height: 500px) { .app-header { padding-top: 8px; padding-bottom: 8px; } .footnote, .brand-copy p, .composer-meta { display: none; } .welcome { padding-top: 6px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14M6 8h3M15 8h3M6 11h3M15 11h3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14m-6-6 6 6 6-6"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16M8 15h3m2 0h3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9ZM14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6ZM8 12l3 3 5-6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
  </svg>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img class="company-logo" src="./ge-creative-logo.webp" width="2048" height="431" alt="GEクリエイティブ" fetchpriority="high" />
        <div class="brand-copy"><h1>社内マニュアルAI</h1><p>社内の手続きやルールを、いつもの言葉で。</p></div>
      </div>
      <button id="clear-button" class="clear-button" type="button" aria-label="会話をクリア"><svg class="icon" aria-hidden="true"><use href="#i-clear"/></svg><span><span class="clear-long">会話を</span>クリア</span></button>
    </header>
    <section class="chat-container" aria-label="社内マニュアルへの質問">
      <div id="chat-messages" class="chat-messages" role="region" aria-label="現在の会話" tabindex="0">
        <section id="welcome" class="welcome" aria-labelledby="welcome-title">
          <div class="welcome-icon" aria-hidden="true"><svg class="icon"><use href="#i-book"/></svg></div>
          <h2 id="welcome-title">社内の「どうする？」を、<br>ここで。</h2>
          <p>勤怠や申請、社内ルールについて。<br>知りたいことを、そのまま質問してください。</p>
          <div class="suggestions" aria-label="質問の例">
            <button type="button" class="suggestion" data-question="有給休暇の申請方法を教えて"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span>有給休暇は、どうやって申請する？</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
            <button type="button" class="suggestion" data-question="経費精算に必要なものを教えて"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg><span>経費精算に必要なものは？</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
            <button type="button" class="suggestion" data-question="不審なメールを受け取ったらどうすればいい？"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span>不審なメールを受け取ったら？</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
          </div>
        </section>
      </div>
      <div class="jump-wrap"><button id="jump-button" class="jump-button" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>最新の回答へ</button></div>
      <div class="composer-area">
        <div class="typing-indicator" id="typing-indicator" role="status"><span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span><span>マニュアルを確認しています…</span></div>
        <form id="chat-form" class="message-input">
          <label class="sr-only" for="user-input">社内マニュアルについて質問（1000文字まで）</label>
          <textarea id="user-input" placeholder="社内ルールや申請方法について質問してください" rows="1" maxlength="1000" aria-describedby="chat-disclaimer" enterkeyhint="enter"></textarea>
          <button id="send-button" type="submit" disabled aria-label="質問を送信"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg><span>送信</span></button>
        </form>
        <div class="composer-meta"><p id="chat-disclaimer">登録済みのマニュアルをもとに回答します。AIの回答には誤りが含まれる場合があります。</p><span class="keyboard-hint">Enterで送信 / Shift + Enterで改行</span></div>
      </div>
    </section>
    <p class="footnote">この画面の会話は、ページの再読み込み・クリアで消えます。</p>
  </main>
  <dialog id="clear-dialog" class="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description">
    <h2 id="clear-title">会話をクリアしますか？</h2><p id="clear-description">この画面のやり取りと入力中の内容を消去します。<br>クリアした会話は元に戻せません。</p>
    <div class="dialog-actions"><button id="cancel-clear" type="button" autofocus>キャンセル</button><button id="confirm-clear" class="confirm" type="button">クリアする</button></div>
  </dialog>
  <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>
  <noscript>チャットを利用するにはJavaScriptを有効にしてください。</noscript>
  <script src="./chat.js" defer></script>
</body>
</html>
